<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="0.55" stop-color="#facc15"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- deck: two cards behind -->
  <rect x="62" y="30" width="150" height="110" rx="16" fill="#0e7490" opacity="0.45"/>
  <rect x="48" y="44" width="150" height="110" rx="16" fill="#0891b2" opacity="0.7"/>
  <!-- front terminal card -->
  <rect x="32" y="58" width="158" height="122" rx="18" fill="url(#card)" stroke="#22d3ee" stroke-width="5"/>
  <circle cx="54" cy="79" r="6" fill="#f87171"/>
  <circle cx="74" cy="79" r="6" fill="#fbbf24"/>
  <circle cx="94" cy="79" r="6" fill="#34d399"/>
  <!-- prompt >_ -->
  <path d="M56 110 L82 128 L56 146" fill="none" stroke="#34d399" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="96" y="141" width="40" height="10" rx="5" fill="#34d399"/>
  <!-- golden key, in front (dark outline keeps it readable at small sizes) -->
  <g transform="translate(2 -12) rotate(-35 180 186)">
    <g stroke="#0f172a" stroke-width="12" stroke-linejoin="round" fill="#0f172a">
      <circle cx="204" cy="186" r="33"/>
      <rect x="96" y="176" width="100" height="20" rx="6"/>
      <rect x="108" y="190" width="16" height="24" rx="4"/>
      <rect x="132" y="190" width="14" height="17" rx="4"/>
    </g>
    <g fill="url(#gold)">
      <circle cx="204" cy="186" r="33"/>
      <rect x="96" y="176" width="100" height="20" rx="6"/>
      <rect x="108" y="190" width="16" height="24" rx="4"/>
      <rect x="132" y="190" width="14" height="17" rx="4"/>
    </g>
    <circle cx="210" cy="186" r="12" fill="#0f172a"/>
    <path d="M176 172 A30 30 0 0 1 204 156" fill="none" stroke="#fef9c3" stroke-width="5"
          stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
