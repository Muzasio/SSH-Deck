<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <!-- deck: two cards behind -->
  <rect x="66" y="40" width="148" height="112" rx="16" fill="#0e7490" opacity="0.45"/>
  <rect x="54" y="54" width="148" height="112" rx="16" fill="#0891b2" opacity="0.7"/>
  <!-- front terminal card -->
  <rect x="40" y="70" width="160" height="124" rx="18" fill="url(#card)" stroke="#22d3ee" stroke-width="5"/>
  <circle cx="62" cy="91" r="6" fill="#f87171"/>
  <circle cx="82" cy="91" r="6" fill="#fbbf24"/>
  <circle cx="102" cy="91" r="6" fill="#34d399"/>
  <!-- prompt >_ -->
  <path d="M66 124 L94 144 L66 164" fill="none" stroke="#34d399" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="108" y="158" width="44" height="11" rx="5.5" fill="#34d399"/>
  <!-- online dot -->
  <circle cx="198" cy="190" r="26" fill="#0f172a"/>
  <circle cx="198" cy="190" r="17" fill="#22c55e"/>
</svg>
